<script>
const ALL = [{"topic":"Complicações de Dispositivos e Cateteres","num":1,"q":"Qual o achado clínico que mais sugere bacteriémia associada a cateter de HD?","a":"Febre com calafrios a iniciar durante a sessão de hemodiálise, sem outro foco; confirma-se com hemoculturas pareadas (tempo diferencial de positividade ≥2 h)."},{"topic":"Complicações de Dispositivos e Cateteres","num":1,"q":"Quais os critérios de diagnóstico de peritonite associada a DP (ISPD 2022)?","a":"2 de 3: (1) sintomas/sinais de peritonite (dor + líquido turvo); (2) leucócitos no efluente >100/µL com >50% PMN; (3) cultura positiva."},{"topic":"Complicações de Dispositivos e Cateteres","num":1,"q":"Quando NÃO se deve tentar selo de antibiótico e deve remover-se o cateter de HD?","a":"Sépsis grave/instabilidade, infeção do túnel, bacteriémia persistente >72 h, *S. aureus*, *Pseudomonas*, fungos ou complicação metastática; e sempre que o cateter seja não tunelizado."},{"topic":"Complicações de Dispositivos e Cateteres","num":1,"q":"Como distingo, ao exame, uma estenose de outflow numa FAV?","a":"FAV hiperpulsátil que não colapsa com a elevação do braço, com pulso *water-hammer* e sopro de alta frequência localizado distalmente; confirma-se por eco-Doppler/fistulografia."},{"topic":"Complicações de Dispositivos e Cateteres","num":1,"q":"Qual a terapêutica de destrombose de um cateter de HD com vaina de fibrina e qual a dose?","a":"Selo de alteplase (rt-PA) 1–2 mg por lúmen, com permanência de ~30–60 min (ou *dwell* prolongado), repetível; se refratária, *stripping* da vaina ou troca do cateter sobre fio-guia."},{"topic":"Terapia de Substituição Renal (TSR)","num":2,"q":"Quando se inicia TSR na DRC — por um valor de TFGe ou por critério clínico?","a":"Por critério clínico (sintomas/sinais de uremia, sobrecarga refratária, distúrbios eletrolíticos/acidose, ou intoxicação dialisável). O número de TFGe não é gatilho isolado — o IDEAL trial (2010) mostrou que iniciar cedo não traz benefício."},{"topic":"Terapia de Substituição Renal (TSR)","num":2,"q":"Diga as indicações urgentes de diálise.","a":"Mnemónica AEIOU: Acidose metabólica refratária; Electrólitos (hipercaliémia grave/refratária); Intoxicações dialisáveis; Overload (sobrecarga/EAP refratário); Uremia sintomática (pericardite, encefalopatia, hemorragia, vómitos)."},{"topic":"Terapia de Substituição Renal (TSR)","num":2,"q":"Qual o alvo de adequação em hemodiálise?","a":"spKt/V ≥ 1,2 por sessão (alvo de segurança ≥ 1,4), ou URR ≥ 65%, em HD convencional 3×/semana, 4 h (KDOQI 2015). Em DP, Kt/V semanal total ≥ 1,7."},{"topic":"Terapia de Substituição Renal (TSR)","num":2,"q":"O que é a síndrome de desequilíbrio e como a prevenir?","a":"Edema cerebral osmótico por descida demasiado rápida da ureia, típico das primeiras sessões com uremia muito elevada (cefaleia, confusão, convulsões). Prevenção: iniciar gradualmente — sessões curtas, fluxo de sangue baixo, dialisador pequeno, limitando a redução de ureia."},{"topic":"Terapia de Substituição Renal (TSR)","num":2,"q":"Qual a melhor modalidade de TSR em termos de sobrevida e quando é ideal?","a":"O transplante renal, idealmente pré-emptivo (antes de iniciar diálise), sobretudo com dador vivo — confere a melhor sobrevida e qualidade de vida."},{"topic":"Infeção do Trato Urinário (ITU)","num":3,"q":"O que distingue clinicamente cistite de pielonefrite?","a":"A febre (≥ 38 °C), calafrios e dor lombar com punho-percussão positiva e repercussão sistémica — ausentes na cistite, que é uma infeção mucosa da bexiga sem febre."},{"topic":"Infeção do Trato Urinário (ITU)","num":3,"q":"Quando tratar bacteriúria assintomática (IDSA 2019)?","a":"Apenas em grávidas e antes de procedimento urológico com lesão prevista da mucosa. Não tratar em mulheres não grávidas, idosos, diabéticos ou algaliados — não há benefício e seleciona resistências."},{"topic":"Infeção do Trato Urinário (ITU)","num":3,"q":"Doente com pielonefrite mantém febre 72 h após antibiótico adequado — o que faz?","a":"Suspeitar de complicação (abcesso renal/perinéfrico, obstrução/pionefrose, pielonefrite enfisematosa) e pedir TC abdómino-pélvica com contraste; ponderar drenagem/controlo do foco e rever o TSA."},{"topic":"Infeção do Trato Urinário (ITU)","num":3,"q":"Qual a primeira linha empírica na cistite não complicada e por que evitar quinolonas?","a":"Fosfomicina 3 g dose única, nitrofurantoína 5 dias ou pivmecilinam. As fluoroquinolonas evitam-se por elevada resistência, efeitos adversos graves (tendinopatia, aneurisma) e devem reservar-se para ITU alta — princípio de *antibiotic stewardship*."},{"topic":"Infeção do Trato Urinário (ITU)","num":3,"q":"Porque é toda a ITU no homem considerada complicada e o que muda?","a":"Pela frequente associação a próstata/obstrução e anomalia anatómica; obriga a urocultura, ponderar prostatite (toque rectal, sem massagem), antibiótico com boa penetração prostática (fluoroquinolona/cotrimoxazol) e duração mais longa (2-4 semanas na prostatite)."},{"topic":"Síndrome Hepatorrenal","num":4,"q":"Qual o exame que distingue SHR de LRA pré-renal?","a":"A prova de expansão volémica com albumina 1 g/kg/dia (máx. 100 g) durante 2 dias + suspensão de diuréticos: se a creatinina normaliza é pré-renal; se persiste, é SHR."},{"topic":"Síndrome Hepatorrenal","num":4,"q":"Que valor de neutrófilos no líquido ascítico define PBE e qual o seu papel na SHR?","a":"≥ 250 neutrófilos/mm³. A PBE é o principal precipitante de SHR-LRA; o tratamento inclui antibiótico + albumina (1,5 g/kg no dia 1 e 1 g/kg no dia 3) para a prevenir."},{"topic":"Síndrome Hepatorrenal","num":4,"q":"Converta uma creatinina de 221 µmol/L para mg/dL e diga se cumpre critério de LRA com basal de 88 µmol/L.","a":"221 ÷ 88,4 = 2,5 mg/dL; basal 88 µmol/L (1,0 mg/dL). 221/88 ≈ 2,5× → > 1,5× o basal, logo cumpre critério ICA/KDIGO de LRA."},{"topic":"Síndrome Hepatorrenal","num":4,"q":"Esquema farmacológico de 1.ª linha na SHR-LRA e doses.","a":"Terlipressina 1 mg IV cada 4-6 h (titulável até 2 mg/4-6 h) ou perfusão 2 mg/dia (até 12 mg/dia) + albumina 20-40 g/dia. Alternativa: noradrenalina 0,5-3 mg/h + albumina."},{"topic":"Síndrome Hepatorrenal","num":4,"q":"Qual o tratamento definitivo e o prognóstico sem ele?","a":"Transplante hepático (curativo, pois a SHR é funcional/reversível). Sem transplante o prognóstico é mau, com sobrevida de poucas semanas na SHR-LRA; o tratamento médico funciona sobretudo como ponte. *Diretrizes de referência: ICA 2015/2019; EASL 2018 (cirrose descompensada); AASLD; KDIGO 2012. Doses a confirmar sempre com o protocolo institucional e bula vigente.*"},{"topic":"Diabetes Insipidus Nefrogénico","num":5,"q":"Como distingue, numa frase, DI nefrogénico de DI central?","a":"Pela resposta à desmopressina: no central a osm urinária sobe ≥ 50 % (o rim responde); no nefrogénico não sobe (rim resistente, com ADH/copeptina endógenas presentes)."},{"topic":"Diabetes Insipidus Nefrogénico","num":5,"q":"Qual é o valor de osmolalidade urinária que separa poliúria aquosa de poliúria osmótica e porquê importa?","a":"~300 mOsm/kg: abaixo é diurese aquosa (DI / polidipsia primária); acima, sobretudo > 600-700, sugere diurese osmótica (glicosúria, manitol, ureia). Orienta logo o diferencial."},{"topic":"Diabetes Insipidus Nefrogénico","num":5,"q":"Porque é que se usam diuréticos tiazídicos (que aumentam a diurese) para *tratar* a poliúria do DIN?","a":"Induzem ligeira contração de volume → ↑ reabsorção proximal de Na⁺ e água → menos água livre chega ao túbulo distal → reduz o volume urinário. Paradoxo terapêutico; associar amiloride no DIN do lítio."},{"topic":"Diabetes Insipidus Nefrogénico","num":5,"q":"No DIN por lítio, qual o fármaco adjuvante de eleição e qual o seu mecanismo?","a":"Amiloride — bloqueia o canal ENaC da célula principal, impedindo a entrada de lítio na célula e poupando potássio (atenua a hipocaliemia da tiazida)."},{"topic":"Diabetes Insipidus Nefrogénico","num":5,"q":"A que ritmo corrige a hipernatremia crónica e qual o risco de a corrigir depressa?","a":"≤ 8-10 mmol/L por 24 h (~0,5 mmol/L/h). Correção rápida → edema cerebral, convulsões e morte. Não esquecer de repor também as perdas urinárias em curso. *Documento de estudo — revisão crítica recomendada antes da prova. Valores de corte (copeptina, osmolalidades) a confirmar com o laboratório local.*"},{"topic":"Distúrbios Hidroeletrolíticos Graves — Hipercaliemia","num":6,"q":"Qual é a primeira medida na hipercaliemia grave com alterações ECG?","a":"*Gluconato de cálcio 10%, 10 mL IV em 5–10 min (estabiliza a membrana cardíaca); repetir até 30 mL. Não baixa o K⁺.*"},{"topic":"Distúrbios Hidroeletrolíticos Graves — Hipercaliemia","num":6,"q":"Como distingue hipercaliemia verdadeira de pseudohipercaliemia?","a":"*Repetir K⁺ sem garrote, em plasma heparinizado, com processamento rápido; correlacionar com ECG e hemograma. Soro > plasma sugere pseudo. Se há sintomas/ECG alterado, trata-se na mesma.*"},{"topic":"Distúrbios Hidroeletrolíticos Graves — Hipercaliemia","num":6,"q":"Porque é que o doente diabético com DRC tem hipercaliemia desproporcionada?","a":"*Hipoaldosteronismo hiporreninémico (ATR tipo 4) — acidose metabólica hiperclorémica com hiato aniónico normal e renina/aldosterona baixas.*"},{"topic":"Distúrbios Hidroeletrolíticos Graves — Hipercaliemia","num":6,"q":"Qual é o tratamento definitivo na hipercaliemia refratária com LRA oligúrica?","a":"*Hemodiálise — remoção mais rápida e eficaz do K⁺ corporal total; acionar Nefrologia precocemente.*"},{"topic":"Distúrbios Hidroeletrolíticos Graves — Hipercaliemia","num":6,"q":"Que fármacos suspende imediatamente?","a":"*IECA/ARA, espironolactona/eplerenona, amilorida, AINE, trimetoprim, heparina e suplementos/substitutos de sal com KCl.*"},{"topic":"Gasometria Arterial e Distúrbios Ácido-Base","num":7,"q":"Qual a fórmula de Winter e para que serve?","a":"pCO2 esperada (mmHg) = 1,5 × HCO3⁻ + 8 (±2) [≈ 0,2 × HCO3⁻ + 1,07 kPa]. Avalia se a compensação respiratória de uma acidose metabólica é adequada; desvio = distúrbio respiratório sobreposto."},{"topic":"Gasometria Arterial e Distúrbios Ácido-Base","num":7,"q":"Porque se corrige o anion gap para a albumina?","a":"Cada 1 g/dL de albumina abaixo de 4,0 reduz o AG em ~2,5 mmol/L; sem corrigir, um doente hipoalbuminémico com acidose de AG aumentado parece ter AG \"normal\"."},{"topic":"Gasometria Arterial e Distúrbios Ácido-Base","num":7,"q":"Como distingue diarreia de ATR numa acidose hiperclorémica?","a":"Anion gap urinário: negativo = diarreia (rim excreta NH4Cl); positivo = ATR (defeito de acidificação)."},{"topic":"Gasometria Arterial e Distúrbios Ácido-Base","num":7,"q":"Quando suspeita de intoxicação por metanol/etilenoglicol e o que pede?","a":"Acidose de AG aumentado com gap osmolar elevado; peço osmolalidade medida, doseamento de álcoois, urina (oxalato), e considero fomepizol + hemodiálise."},{"topic":"Gasometria Arterial e Distúrbios Ácido-Base","num":7,"q":"Deve dar bicarbonato na cetoacidose diabética?","a":"Em regra não; trata-se a causa (insulina + fluidos + K⁺). Considera-se só em acidémia grave (pH < 7,1), com vigilância apertada do potássio (BICAR-ICU, 2018, sugeriu benefício no subgrupo com LRA). Albert MS, Dell RB, Winters RW. *Ann Intern Med* 1967 (fórmula de Winter). Figge J, et al. — correção do AG para albumina, 1998. Mehta AN, et al. — mnemónica GOLDMARK, *Lancet* 2008. Jaber S, et al. — BICAR-ICU, *Lancet* 2018 (bicarbonato na acidémia grave/LRA). ADA / JBDS — gestão da CAD, atualizações 2021–2023."},{"topic":"Síndrome Cardiorrenal","num":8,"q":"Qual é, hoje, o principal mecanismo hemodinâmico da LRA na IC aguda?","a":"A congestão venosa (PVC elevada → ↑ pressão venosa renal → ↓ gradiente transglomerular), mais do que o baixo débito. Demonstrado por estudos hemodinâmicos (ESCAPE e coortes posteriores)."},{"topic":"Síndrome Cardiorrenal","num":8,"q":"Distinga SCR tipo 1 de tipo 3.","a":"Tipo 1 = coração agudo → rim agudo (IC aguda causa LRA). Tipo 3 = rim agudo → coração agudo (LRA primária causa sobrecarga/EAP/arritmia). O diferencial faz-se pela cronologia (qual órgão falhou primeiro)."},{"topic":"Síndrome Cardiorrenal","num":8,"q":"O que diz o DOSE trial sobre a furosemida?","a":"Doses altas (2,5× dose oral) descongestionam mais, com agravamento transitório de creatinina mas sem pior prognóstico; bólus e perfusão contínua são equivalentes. Dose IV inicial ≈ 1–2,5× a dose oral."},{"topic":"Síndrome Cardiorrenal","num":8,"q":"Como interpreta uma subida de creatinina durante a descongestão?","a":"Depende do contexto: se o doente descongestiona, melhora e hemoconcentra, é provavelmente pseudo-piora benigna e não deve travar a depleção; se há congestão persistente, traduz lesão verdadeira e mau prognóstico. A congestão residual é o pior preditor."},{"topic":"Síndrome Cardiorrenal","num":8,"q":"Que terapêuticas adjuvantes na resistência aos diuréticos e qual a evidência?","a":"Acetazolamida 500 mg IV/dia (ADVOR, NEJM 2022) e tiazida/metolazona (bloqueio sequencial do néfron, vigiar K⁺/Na⁺). SGLT2i mantêm-se pelo benefício cardiorrenal. Ultrafiltração só em congestão refratária (CARRESS-HF não mostrou superioridade)."},{"topic":"Nefrite Intersticial","num":9,"q":"Qual é a intervenção terapêutica mais importante na NIA por fármaco?","a":"Suspender de imediato o fármaco causal — frequentemente suficiente para a recuperação; o suporte e os corticoides são adjuvantes."},{"topic":"Nefrite Intersticial","num":9,"q":"A eosinofilúria negativa exclui NIA?","a":"Não. A eosinofilúria tem baixa sensibilidade (~30–40%) e baixa especificidade; a sua ausência não exclui e a sua presença não confirma. Não deve ser usada isoladamente."},{"topic":"Nefrite Intersticial","num":9,"q":"Qual é o padrão de ouro diagnóstico e o que mostra?","a":"A biópsia renal: infiltrado inflamatório intersticial com eosinófilos, edema e tubulite, glomérulos/vasos preservados; quantifica também a fibrose (prognóstico)."},{"topic":"Nefrite Intersticial","num":9,"q":"Que fármaco causa NIA habitualmente com proteinúria nefrótica e porquê?","a":"Os AINE, por lesão glomerular associada do tipo minimal change (sobreposição NIA + podocitopatia)."},{"topic":"Nefrite Intersticial","num":9,"q":"Que particularidades tem a NIA por inibidores de checkpoint?","a":"Latência longa (semanas-meses), gerida como irAE: suspender o ICI e iniciar corticoides (0,5–1 até 1–2 mg/kg/dia) com desmame lento; micofenolato se refratária; reintrodução do ICI é decisão multidisciplinar (evitada nos graus 3–4). Confundidores frequentes: PPI e AINE concomitantes. *Documento de estudo — baseado em evidência atual; incertezas explicitamente assinaladas (sensibilidade da eosinofilúria; dose/timing de corticoides). Doses a confirmar com protocolos institucionais e com o estado renal do doente.*"},{"topic":"Lesão Renal Aguda (LRA)","num":10,"q":"Quais são os critérios de definição de LRA segundo a KDIGO 2012?","a":"↑ creatinina ≥ 26,5 µmol/L em 48 h, ou ≥ 1,5× o basal em 7 dias, ou débito urinário < 0,5 mL/kg/h durante 6 h."},{"topic":"Lesão Renal Aguda (LRA)","num":10,"q":"Como distingue pré-renal de NTA com os índices urinários?","a":"Pré-renal: FeNa < 1 %, Na urinário < 20 mmol/L, osmolalidade > 500 mOsm/kg, sedimento limpo. NTA: FeNa > 2 %, Na > 40 mmol/L, isostenúria, cilindros granulosos castanhos."},{"topic":"Lesão Renal Aguda (LRA)","num":10,"q":"Quando usa a FeUrea em vez da FeNa e qual o corte?","a":"Quando o doente faz diuréticos (que falseiam a FeNa); FeUrea < 35 % sugere pré-renal."},{"topic":"Lesão Renal Aguda (LRA)","num":10,"q":"Quais as indicações urgentes de diálise na LRA?","a":"Mnemónica AEIOU: Acidose refratária, distúrbios Eletrolíticos (hipercaliemia refratária), Intoxicações dialisáveis, sObrecarga de volume refratária, Urémia sintomática (encefalopatia/pericardite)."},{"topic":"Lesão Renal Aguda (LRA)","num":10,"q":"Que estádio KDIGO tem um doente cuja creatinina sobe de 90 para 280 µmol/L?","a":"≈ 3,1× o basal → Estádio 3 (≥ 3,0× ou creatinina ≥ 353,6 µmol/L ou início de TSR)."},{"topic":"Transplante Renal","num":11,"q":"Porque é que a claritromicina pode causar disfunção do enxerto neste doente?","a":"Inibe o CYP3A4/P-glicoproteína, aumentando os níveis de tacrolímus e provocando toxicidade por inibidor da calcineurina (vasoconstrição da arteríola aferente, LRA funcional reversível). Resolução: suspender o macrólido e ajustar o tacrolímus."},{"topic":"Transplante Renal","num":11,"q":"Como distingue, na biópsia, rejeição celular de nefropatia por BK, se ambas mostram nefrite intersticial?","a":"Pela imuno-histoquímica para SV40 (positiva na BKVAN) e pela viremia BK (alta na BKVAN). É crucial porque o tratamento é oposto: aumentar imunossupressão na rejeição vs reduzir na BKVAN."},{"topic":"Transplante Renal","num":11,"q":"Quais são os três critérios de Banff para diagnóstico de AMR ativa?","a":"(1) Lesão tecidual aguda (glomerulite + capilarite peritubular, etc.); (2) evidência de interação anticorpo-endotélio (C4d+ ou g+ptc≥2 ou transcritos endoteliais); (3) DSA circulantes."},{"topic":"Transplante Renal","num":11,"q":"Qual o tratamento de primeira linha da rejeição aguda celular e qual a alternativa se for corticorresistente?","a":"Pulsos de metilprednisolona EV 250–500 mg/dia × 3 dias; se corticorresistente ou grave (com arterite), timoglobulina (ATG)."},{"topic":"Transplante Renal","num":11,"q":"Que profilaxias dá a um recetor de transplante renal e contra o quê?","a":"Valganciclovir (CMV, conforme serologia D/R, ~3–6 meses) e cotrimoxazol (Pneumocystis jirovecii e ITU, ~6–12 meses); ± antifúngico/antiviral conforme risco. Vigiar viremia BK por PCR (rastreio, não profilaxia farmacológica). *Documento de estudo. Doses e alvos devem ser sempre confirmados com os protocolos da unidade de transplantação e a função renal do doente.*"},{"topic":"Síndrome Nefrótica e Síndrome Nefrítica","num":12,"q":"Como distingue hematúria glomerular de não glomerular?","a":"Hemácias dismórficas (sobretudo acantócitos) e cilindros hemáticos no sedimento, frequente proteinúria associada e urina \"coca-cola\" sem coágulos → glomerular. Coágulos, eritrócitos isomórficos e dor cólica → via urinária."},{"topic":"Síndrome Nefrótica e Síndrome Nefrítica","num":12,"q":"Que entidades cursam com complemento BAIXO?","a":"GN pós-infecciosa (C3 baixo, C4 normal), lúpica (C3 e C4 baixos), membranoproliferativa/C3, crioglobulinemia (C4 muito baixo) e endocardite. Complemento normal: IgA, ANCA, anti-MBG."},{"topic":"Síndrome Nefrótica e Síndrome Nefrítica","num":12,"q":"Qual a complicação tromboembólica clássica da síndrome nefrótica e qual a entidade de maior risco?","a":"Trombose da veia renal (e TEP/TVP), por perda urinária de anticoagulantes (antitrombina) e estado pró-trombótico; risco máximo na nefropatia membranosa, sobretudo com albumina <20–25 g/L — justifica anticoagulação profilática."},{"topic":"Síndrome Nefrótica e Síndrome Nefrítica","num":12,"q":"Quando pode dispensar a biópsia renal?","a":"DLM provável na criança (corticoide empírico), membranosa primária com anti-PLA2R + e função preservada (KDIGO 2021) e nefropatia diabética típica (DM longa + retinopatia, sem atipias)."},{"topic":"Síndrome Nefrótica e Síndrome Nefrítica","num":12,"q":"Doente com LRA rapidamente progressiva, hematúria e hemoptises — conduta?","a":"Suspeitar de GNRP (anti-MBG ou ANCA). Pedir anti-MBG, ANCA, complemento, biópsia renal urgente e iniciar pulsos de metilprednisolona + ciclofosfamida/rituximab, com plasmaférese na doença anti-MBG/hemorragia alveolar — sem aguardar a histologia. *Documento de estudo. As doses são orientadoras e devem ser ajustadas ao doente, função renal e protocolos locais do CHUSJ. Diretriz de referência: KDIGO Glomerular Diseases (2021); assinaladas as áreas de incerteza e a evolução terapêutica pós-2021.*"},{"topic":"Doença Renal Crónica (DRC)","num":13,"q":"Como prova que a doença renal é crónica e não aguda?","a":"Documentando TFG <60 ou marcadores de lesão persistentes ≥3 meses (análises antigas) ou, na sua ausência, por marcadores indiretos: rins pequenos hiperecogénicos, anemia normocítica e DMO-DRC."},{"topic":"Doença Renal Crónica (DRC)","num":13,"q":"Como se classifica a DRC pela KDIGO 2024?","a":"Por causa + categoria G (TFG: G1 ≥90 … G5 <15) + categoria A (RAC: A1 <30, A2 30–300, A3 >300 mg/g) — o \"CGA\" — lendo o prognóstico no mapa de cores."},{"topic":"Doença Renal Crónica (DRC)","num":13,"q":"Quais os pilares para travar a progressão?","a":"Controlo tensional (sistólica <120 mmHg quando tolerado), IECA/ARA titulado, inibidor SGLT2, finerenona na DRC diabética, controlo glicémico/lipídico e evicção de nefrotóxicos."},{"topic":"Doença Renal Crónica (DRC)","num":13,"q":"Qual o alvo de hemoglobina no tratamento da anemia e o que faz antes dos AEE?","a":"Alvo Hb 100–115 g/L (não ultrapassar ~115–120 g/L); corrigir primeiro o ferro (ferritina >100 ng/mL, saturação >20–30%) antes de iniciar agentes estimuladores da eritropoiese."},{"topic":"Doença Renal Crónica (DRC)","num":13,"q":"Que parâmetros usa para estimar o prognóstico e quando refere para a Nefrologia?","a":"A KFRE (4 variáveis: idade, sexo, TFG, RAC) para risco de falência a 2/5 anos; refiro tipicamente em G4 (TFG <30), A3, progressão rápida, etiologia incerta ou KFRE elevado, preparando atempadamente o acesso/TSR."},{"topic":"Gamopatias Monoclonais e Rim","num":14,"q":"Porque é que a tira-teste urinária pode ser negativa apesar de o doente ter proteinúria de 24h elevada no mieloma?","a":"Porque a tira reage essencialmente à albumina e não deteta cadeias leves livres (proteinúria de Bence-Jones); daí o «hiato» entre tira e doseamento de 24h."},{"topic":"Gamopatias Monoclonais e Rim","num":14,"q":"Qual o exame que distingue definitivamente cast nephropathy, amiloidose AL e LCDD?","a":"A biópsia renal com microscopia ótica, imunofluorescência (kappa/lambda) e vermelho-do-congo (± microscopia eletrónica): cilindros tubulares (cast); Congo+ com fibrilhas (AL); IF linear monoclonal Congo− (LCDD)."},{"topic":"Gamopatias Monoclonais e Rim","num":14,"q":"O que define MGRS e em que difere do mieloma sintomático?","a":"MGRS é um clone B/plasmocitário que não preenche critérios de malignidade que exijam tratamento por si (massa tumoral de GMSI), mas produz uma imunoglobulina nefrotóxica que causa lesão renal comprovada por biópsia; ao contrário do mieloma sintomático, não tem CRAB — trata-se o clone para salvar o rim."},{"topic":"Gamopatias Monoclonais e Rim","num":14,"q":"Qual o pilar terapêutico e de que depende a recuperação renal?","a":"Terapêutica anti-clone dirigida baseada em bortezomib + dexametasona (± ciclofosfamida/daratumumab), que não requer ajuste renal; a recuperação renal depende da redução rápida e profunda das cadeias leves (resposta hematológica precoce)."},{"topic":"Gamopatias Monoclonais e Rim","num":14,"q":"Qual o papel da plasmaférese e dos filtros de high cut-off na cast nephropathy?","a":"Incerto e não recomendado por rotina: a plasmaférese não mostrou benefício consistente (Clark, 2005) e os filtros HCO deram resultados discordantes/negativos (EuLITE 2019, MYRE 2017). O determinante da recuperação é a resposta hematológica, não a remoção extracorporal. *Documento de estudo. Doses e protocolos devem ser confirmados com Hematologia e ajustados à função renal e ao estadiamento individual.*"},{"topic":"Glomerulopatias","num":15,"q":"Como usa o complemento para estreitar o diferencial de uma GN?","a":"C3 baixo → pós-infeciosa, lúpica, MPGN, crioglobulinemia, C3G. Complemento normal → IgA/PHS, ANCA, anti-MBG, membranosa, podocitopatias. C4 desproporcionadamente baixo aponta crioglobulinemia/LES."},{"topic":"Glomerulopatias","num":15,"q":"Distinga nefropatia IgA de GN pós-estreptocócica pela cronologia e pela IF.","a":"IgA: hematúria sinfaríngica (0–5 dias), C3 normal, IF com IgA mesangial. GNAPE: latência 1–3 semanas, C3 baixo transitório, ASLO+, IF de C3 granular com humps subepiteliais."},{"topic":"Glomerulopatias","num":15,"q":"Quais são as três causas de GNRP por padrão de IF e como as trata?","a":"Imunocomplexos (granular — lúpica, IgA): imunossupressão dirigida. Pauci-imune (ANCA): corticoides + rituximab/ciclofosfamida. Linear (anti-MBG): plasmaférese + corticoides + ciclofosfamida urgente."},{"topic":"Glomerulopatias","num":15,"q":"O que significa um padrão \"full-house\" na IF e qual a sua relevância?","a":"Positividade para IgG, IgA, IgM, C3 e C1q — altamente sugestivo de nefrite lúpica; obriga a classificar (ISN/RPS I–VI) e orienta indução (micofenolato/ciclofosfamida + hidroxicloroquina)."},{"topic":"Glomerulopatias","num":15,"q":"Qual o papel atual da plasmaférese nas GN e onde é indiscutível?","a":"Indiscutível na doença anti-MBG (Goodpasture). Na vasculite ANCA não é rotineira após o ensaio PEXIVAS — reserva-se para creatinina muito elevada/diálise-dependência ou hemorragia alveolar grave. *Documento de estudo. Confirmar doses e indicações com a KDIGO 2021 e protocolos locais do Serviço de Nefrologia do CHUSJ antes de aplicação clínica. Áreas de incerteza assinaladas no texto (plasmaférese na ANCA, corticoides na IgA, novos agentes pós-2021).*"},{"topic":"ECG da Hipercaliemia","num":16,"q":"Um ECG normal exclui hipercaliemia grave?","a":"Não. A correlação ECG–K+ é fraca; doentes com K+ >7 mmol/L podem ter ECG normal. O ECG normal não tranquiliza — guiar pela cinética e pelo valor de K+."},{"topic":"ECG da Hipercaliemia","num":16,"q":"Qual a primeira medida perante alterações do ECG de hipercaliemia e porquê?","a":"Gluconato de cálcio 10%, 10 mL IV em 2–3 min, para estabilização membranar — protege o miocárdio mas não baixa o potássio."},{"topic":"ECG da Hipercaliemia","num":16,"q":"Como distinguir a onda T apiculada da hipercaliemia da onda T hiperaguda do enfarte?","a":"Hipercaliemia: T simétrica, base estreita, difusa, contexto de DRC/fármacos e reversível. Enfarte: T larga, assimétrica, territorial, com dor e troponina elevada."},{"topic":"ECG da Hipercaliemia","num":16,"q":"Indique três fármacos hipercaliemiantes a suspender neste doente.","a":"IECA (lisinopril), antagonista mineralocorticoide (espironolactona) e AINE — bloqueio duplo do eixo RAA mais inibição da síntese de prostaglandinas/perfusão renal."},{"topic":"ECG da Hipercaliemia","num":16,"q":"Qual o tratamento definitivo da hipercaliemia grave refratária na DRC?","a":"Hemodiálise — único método que remove K+ de forma fiável; as restantes medidas (insulina/glicose, salbutamol) são temporizadoras. *Documento de estudo — Nefrologia, Hospital de São João. Doses e limiares conforme UK Renal Association (2020/2023) e ERC (2021); confirmar com protocolo institucional vigente.*"},{"topic":"Neoplasias Renais","num":17,"q":"Qual é o achado imagiológico que melhor distingue uma massa renal sólida maligna de um quisto?","a":"O realce após contraste (aumento ≥ 15–20 UH na TC). Massa sólida com realce é CCR até prova em contrário."},{"topic":"Neoplasias Renais","num":17,"q":"Como reconhece um angiomiolipoma na TC e quando o trata?","a":"Pela gordura macroscópica (densidade < −10 a −20 UH). Trata-se (embolização/cirurgia) se sintomático ou > 4 cm pelo risco de hemorragia; o AML pobre em gordura é indistinguível do CCR e pode exigir biópsia."},{"topic":"Neoplasias Renais","num":17,"q":"O que é a classificação de Bosniak e que categoria exige tratamento?","a":"Estratifica quistos renais por risco de malignidade (I, II, IIF, III, IV). III e IV (realce mensurável em septos/parede ou nódulo sólido) têm risco elevado e exigem tratamento; IIF faz vigilância."},{"topic":"Neoplasias Renais","num":17,"q":"Porque se prefere a nefrectomia parcial e qual a sua implicação nefrológica?","a":"Porque, com controlo oncológico equivalente nos T1, preserva nefrónios, reduzindo o risco de DRC e de eventos cardiovasculares; a nefrectomia radical associa-se a maior queda da TFGe."},{"topic":"Neoplasias Renais","num":17,"q":"Refira três síndromes paraneoplásicas do CCR relevantes para o nefrologista.","a":"Hipercalcemia (PTHrP), policitemia (eritropoietina ectópica) e síndrome de Stauffer (disfunção hepática reversível sem metástases). Também HTA (renina) e anemia."},{"topic":"Medicamentos Nefroprotetores e Nefrotóxicos","num":18,"q":"Ao iniciar um IECA, a creatinina sobe 25%. Suspende?","a":"Não. Subidas até ~30% são esperadas e nefroprotetoras (vasodilatação da eferente). Reavaliar creatinina e K a 1–2 semanas; suspender só se > 30%, hipercaliémia ou suspeita de estenose bilateral."},{"topic":"Medicamentos Nefroprotetores e Nefrotóxicos","num":18,"q":"Como distingue NIA de NTA no laboratório?","a":"NIA: leucocitúria estéril, eosinofilia/eosinofilúria, cilindros leucocitários, fármaco novo ~7–10 d. NTA: cilindros granulosos pigmentados, FeNa > 2%, distúrbios eletrolíticos típicos. Padrão definitivo é a biópsia."},{"topic":"Medicamentos Nefroprotetores e Nefrotóxicos","num":18,"q":"Qual a medida mais eficaz para prevenir nefropatia do contraste e o que NÃO recomenda?","a":"Hidratação EV com soro fisiológico peri-procedimento. Não recomendar N-acetilcisteína (PRESERVE 2018, sem benefício). A incidência real do dano por contraste é provavelmente sobrestimada."},{"topic":"Medicamentos Nefroprotetores e Nefrotóxicos","num":18,"q":"Como monitoriza a vancomicina para minimizar nefrotoxicidade?","a":"Por AUC₂₄/CMI alvo 400–600 mg·h/L (consenso 2020), preferível ao vale isolado; evitar combinação com piperacilina-tazobactam."},{"topic":"Medicamentos Nefroprotetores e Nefrotóxicos","num":18,"q":"Doente diabético tipo 2 com DRC e albuminúria já em IECA dose máxima — que fármacos acrescenta para nefroproteção?","a":"Inibidor SGLT2 (dapagliflozina/empagliflozina) e finerenona (se K ≤ 4,8 mmol/L e TFG ≥ 25), conforme KDIGO Diabetes 2022; otimizar PA (< 120 mmHg) e HbA1c. *Nota de incerteza: a real incidência da nefropatia induzida por contraste tem sido revista em baixa por estudos com grupos de controlo emparelhados; e a N-acetilcisteína não demonstrou benefício preventivo. Doses e alvos devem ser sempre confirmados no resumo das características do medicamento e nas diretrizes vigentes.*"}];
let pool = ALL.slice(), idx = 0, showA = false;
const $ = id => document.getElementById(id);
const topics = [...new Set(ALL.map(c => c.num + '. ' + c.topic))];
$('topic').innerHTML = '<option value="all">Todos os temas ('+ALL.length+')</option>' +
  topics.map(t => '<option value="'+t+'">'+t+'</option>').join('');
function render(){
  const c = pool[idx];
  if(!c){ $('q').textContent='Sem cartões'; return; }
  $('tag').textContent = c.num + '. ' + c.topic;
  $('q').textContent = c.q;
  $('a').textContent = c.a;
  $('a').classList.toggle('hidden', !showA);
  $('hint').classList.toggle('hidden', showA);
  $('counter').textContent = (idx+1) + ' / ' + pool.length;
}
function flip(){ showA = !showA; render(); }
function go(d){ idx = (idx + d + pool.length) % pool.length; showA = false; render(); }
function shuffle(){ for(let i=pool.length-1;i>0;i--){const j=(i*2654435761>>>0)%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];} idx=0;showA=false;render(); }
$('card').onclick = flip;
$('flip').onclick = e => { e.stopPropagation(); flip(); };
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('shuffle').onclick = shuffle;
$('topic').onchange = e => {
  const v = e.target.value;
  pool = v==='all' ? ALL.slice() : ALL.filter(c => (c.num+'. '+c.topic)===v);
  idx=0; showA=false; render();
};
document.addEventListener('keydown', e => {
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  else if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
});
render();
</script></body></html>
